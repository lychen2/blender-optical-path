<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="790" viewBox="0 0 1160 790" role="img" aria-labelledby="title desc">
<title id="title">Six-step optical figure workflow</title>
<desc id="desc">Read left to right across the top: understand, clarify once, model the optics. Continue down and right to left: assemble, style and preview, verify and deliver. Preview feedback updates style and shared rules. Optical model, display geometry, shading, and 2D annotation remain distinct.</desc>
<rect width="1160" height="790" fill="#ffffff"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker></defs>
<text x="40" y="55.0" font-family="Arial,Liberation Sans,sans-serif" font-size="30" fill="#1e293b" text-anchor="start">Build an optical figure in six steps</text>
<text x="40" y="95.0" font-family="Arial,Liberation Sans,sans-serif" font-size="19" fill="#475569" text-anchor="start">Preserve optical meaning through every stage.</text>
<rect x="40" y="130" width="320" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="200.0" y="190.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">01  Understand</text>
<text x="200.0" y="215.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="200.0" y="240.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Topology, ports, directions</text>
<text x="200.0" y="265.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Physical vs display coordinates</text>
<rect x="420" y="130" width="320" height="180" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="580.0" y="190.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">02  Clarify once</text>
<text x="580.0" y="215.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="580.0" y="240.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Resolve optical + style blockers</text>
<text x="580.0" y="265.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">One batch, if choices remain</text>
<rect x="800" y="130" width="320" height="180" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="960.0" y="190.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">03  Model the optics</text>
<text x="960.0" y="215.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="960.0" y="240.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Calculate conjugates + envelopes</text>
<text x="960.0" y="265.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Record assumptions + limits</text>
<rect x="800" y="400" width="320" height="180" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="960.0" y="460.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">04  Assemble</text>
<text x="960.0" y="485.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="960.0" y="510.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Place reviewed components</text>
<text x="960.0" y="535.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Check interfaces + orientation</text>
<rect x="420" y="400" width="320" height="180" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="580.0" y="460.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">05  Style + preview</text>
<text x="580.0" y="485.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="580.0" y="510.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Choose materials + lighting</text>
<text x="580.0" y="535.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Inspect a render without text</text>
<rect x="40" y="400" width="320" height="180" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="200.0" y="460.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">06  Verify + deliver</text>
<text x="200.0" y="485.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle"></text>
<text x="200.0" y="510.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Check optics, geometry + labels</text>
<text x="200.0" y="535.0" font-family="Arial,Liberation Sans,sans-serif" font-size="20" fill="#1e293b" text-anchor="middle">Save scene + editable 2D overlay</text>
<path d="M 368 220 L 412 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 748 220 L 792 220" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 960 318 L 960 392" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 792 490 L 748 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 412 490 L 368 490" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 660 588 L 660 618 L 770 618 L 770 552 L 748 552" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<text x="400" y="654.0" font-family="Arial,Liberation Sans,sans-serif" font-size="17" fill="#9a3412" text-anchor="start">Visual issue: revise style + shared rules</text>
<rect x="40" y="705" width="210" height="44" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="145.0" y="733.75" font-family="Arial,Liberation Sans,sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">Optical model</text>
<rect x="330" y="705" width="210" height="44" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
<text x="435.0" y="733.75" font-family="Arial,Liberation Sans,sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">Display geometry</text>
<rect x="620" y="705" width="210" height="44" rx="12" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
<text x="725.0" y="733.75" font-family="Arial,Liberation Sans,sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">Shading</text>
<rect x="910" y="705" width="210" height="44" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.5"/>
<text x="1015.0" y="733.75" font-family="Arial,Liberation Sans,sans-serif" font-size="18" fill="#1e293b" text-anchor="middle">2D annotation</text>
<path d="M 260 727 L 320 727" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 550 727 L 610 727" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 840 727 L 900 727" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
